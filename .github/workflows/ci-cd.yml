name: CI

on:
  push:
    paths:
      - 'formal/**'
      - 'informal/**'
      - 'scripts/check_po.py'
  pull_request:
    paths:
      - 'formal/**'
      - 'informal/**'
      - 'scripts/check_po.py'
  workflow_dispatch:

jobs:
  po-ellenorzes:
    runs-on: ubuntu-latest
    name: .po-ellenőrzés (msgfmt -c, helyőrzők, fejlécek, fájlnevek, .mo a .po mellett)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python és gettext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
          python3 -m pip install --quiet polib

      - name: Ellenőrzés
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A meglévő hibák miatt csak a változott csomagmappák blokkolnak; kézi indításnál minden fájl.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            python3 scripts/check_po.py --all
          elif [ "$EVENT" = "pull_request" ]; then
            python3 scripts/check_po.py --changed-since "$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check_po.py --changed-since "$BEFORE"
          else
            python3 scripts/check_po.py --changed-since HEAD~1
          fi
